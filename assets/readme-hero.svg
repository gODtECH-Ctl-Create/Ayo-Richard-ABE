<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
<title id="title">Ayo Richard Abe animated portfolio hero</title>
<desc id="desc">Animated portfolio visualization for Ayo Richard Abe and gODtECH, focused on product, engineering, and systems.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#11110f"/>
    <stop offset="0.55" stop-color="#171713"/>
    <stop offset="1" stop-color="#0b0b0a"/>
  </linearGradient>
  <linearGradient id="lime" x1="0" x2="1">
    <stop stop-color="#b7ff3c" stop-opacity="0"/>
    <stop offset="0.48" stop-color="#b7ff3c"/>
    <stop offset="1" stop-color="#efffcf" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="text" x1="0" x2="1">
    <stop stop-color="#ffffff"/>
    <stop offset="0.58" stop-color="#d9ff9a"/>
    <stop offset="1" stop-color="#b7ff3c"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#ffffff" stroke-opacity="0.045"/></pattern>
  <clipPath id="clip"><rect width="1400" height="460" rx="30"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1400" height="460" fill="url(#bg)"/>
  <rect width="1400" height="460" fill="url(#grid)"/>
  <circle cx="1190" cy="30" r="280" fill="#b7ff3c" opacity="0.07" filter="url(#glow)">
    <animate attributeName="r" values="230;310;230" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".045;.11;.045" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="470" r="230" fill="#b7ff3c" opacity="0.055" filter="url(#glow)">
    <animate attributeName="r" values="200;260;200" dur="6s" repeatCount="indefinite"/>
  </circle>

  <path d="M-60 370 C280 160 480 430 760 220 S1160 120 1470 230" fill="none" stroke="url(#lime)" stroke-width="2" opacity="0.65">
    <animate attributeName="stroke-dasharray" values="12 90;150 28;12 90" dur="4.8s" repeatCount="indefinite"/>
  </path>

  <g transform="translate(74 54)">
    <rect width="1252" height="338" rx="27" fill="#11110f" fill-opacity="0.79" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="20" y="20" width="1212" height="34" rx="12" fill="#1d1d19" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="40" cy="37" r="4" fill="#ff5f57"/><circle cx="57" cy="37" r="4" fill="#febc2e"/><circle cx="74" cy="37" r="4" fill="#28c840"/>
    <text x="101" y="42" fill="#77776f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">GODTECH / PORTFOLIO-SYSTEM</text>

    <g transform="translate(58 88)">
      <circle cx="118" cy="105" r="96" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
      <ellipse cx="118" cy="105" rx="143" ry="76" fill="none" stroke="#b7ff3c" stroke-opacity="0.38" transform="rotate(-28 118 105)">
        <animateTransform attributeName="transform" type="rotate" values="-28 118 105;332 118 105" dur="15s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="118" cy="105" rx="138" ry="70" fill="none" stroke="#ffffff" stroke-opacity="0.14" transform="rotate(36 118 105)">
        <animateTransform attributeName="transform" type="rotate" values="36 118 105;-324 118 105" dur="19s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="118" cy="105" r="66" fill="#171713" stroke="#b7ff3c" stroke-opacity="0.52"/>
      <text x="118" y="119" text-anchor="middle" fill="#b7ff3c" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="800" letter-spacing="-2">AR</text>
      <circle cx="24" cy="55" r="5" fill="#b7ff3c" filter="url(#glow)"><animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="229" cy="139" r="4" fill="#ffffff" opacity=".9"><animate attributeName="opacity" values=".25;1;.25" dur="1.7s" repeatCount="indefinite"/></circle>
      <rect x="-5" y="188" width="83" height="26" rx="13" fill="#1d1d19" stroke="#ffffff" stroke-opacity=".12"/><text x="36" y="205" text-anchor="middle" fill="#a4a49d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">PRODUCT</text>
      <rect x="90" y="214" width="87" height="26" rx="13" fill="#1d1d19" stroke="#b7ff3c" stroke-opacity=".28"/><text x="133" y="231" text-anchor="middle" fill="#b7ff3c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">SYSTEMS</text>
      <rect x="187" y="188" width="89" height="26" rx="13" fill="#1d1d19" stroke="#ffffff" stroke-opacity=".12"/><text x="231" y="205" text-anchor="middle" fill="#a4a49d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">BUILD</text>
    </g>

    <g transform="translate(362 91)">
      <text x="0" y="14" fill="#b7ff3c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="3">PRODUCT × ENGINEERING × SYSTEMS</text>
      <text x="0" y="70" fill="url(#text)" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="800" letter-spacing="-2">Ayo Richard Abe</text>
      <text x="0" y="102" fill="#9d9d95" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">product manager // product builder // systems thinker</text>

      <g transform="translate(0 145)">
        <text fill="#f3f3ef" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
          <tspan>I turn difficult problems into useful products.</tspan>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.72;1" dur="6s" repeatCount="indefinite"/>
        </text>
        <text fill="#f3f3ef" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
          <tspan>Strategy → prototype → system → working product.</tspan>
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.18;.32;.78;1" dur="6s" repeatCount="indefinite"/>
        </text>
        <text fill="#f3f3ef" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
          <tspan>Build what matters. Simplify what gets in the way.</tspan>
          <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;.3;.46;.58;.86;1" dur="6s" repeatCount="indefinite"/>
        </text>
      </g>

      <g transform="translate(0 188)">
        <rect width="560" height="7" rx="3.5" fill="#24241f"/>
        <rect width="210" height="7" rx="3.5" fill="#b7ff3c"><animate attributeName="width" values="110;490;260;110" dur="4s" repeatCount="indefinite"/></rect>
      </g>
      <text x="0" y="229" fill="#707069" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">CONSTRUCTION • FINANCE • HEALTH • EDUCATION • AI • DEVELOPER SYSTEMS</text>
    </g>

    <g transform="translate(1016 92)">
      <rect width="178" height="174" rx="20" fill="#171713" stroke="#ffffff" stroke-opacity=".11"/>
      <text x="18" y="29" fill="#77776f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">CURRENT MODE</text>
      <text x="18" y="65" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">BUILDING</text>
      <circle cx="145" cy="57" r="8" fill="#b7ff3c"><animate attributeName="r" values="6;12;6" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="18" y="102" fill="#9b9b94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">IDEAS</text>
      <text x="18" y="120" fill="#9b9b94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">PRODUCTS</text>
      <text x="18" y="138" fill="#9b9b94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">SYSTEMS</text>
      <text x="18" y="156" fill="#b7ff3c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">→ SHIPPING</text>
    </g>

    <text x="58" y="311" fill="#5f5f59" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="2">GODTECH • THINK • DESIGN • BUILD • TEST • ITERATE</text>
  </g>
  <text x="700" y="430" text-anchor="middle" fill="#696962" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="4">MAKE DIFFICULT WORK FEEL SIMPLER</text>
</g>
</svg>